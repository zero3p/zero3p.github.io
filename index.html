about:function(){return wrap('about',lang=='ar'?`<p><b>ZERO</b> منصة عربية تهتم بألعاب وبرامج PlayStation 4، وتقدّم الشروحات والتحديثات في مكان واحد بشكل منظّم وسريع.</p><h3>رسالتنا</h3><p>تسهيل وصولك إلى ما تبحث عنه: أقسام واضحة، بحث سريع، ومعلومات مرتبة لكل ملف مثل الحجم ورقم النسخة وسنة الإصدار.</p><h3>ماذا نقدّم؟</h3><ul><li>ألعاب وبرامج PlayStation 4 مع تحديث المحتوى باستمرار.</li><li>شروحات تساعدك على التثبيت والاستخدام.</li><li>أخبار التحديثات والإصدارات الجديدة.</li><li>أقسام إضافية لمنصات أخرى وللمحاكيات والبرامج والثيمات.</li></ul><h3>لماذا ZERO؟</h3><p>واجهة بسيطة تدعم العربية والإنجليزية، تعمل بسلاسة على الهاتف والكمبيوتر، ومحتوى مصنّف لتصل إلى ما تريد بأقل خطوات.</p><p>تابعنا عبر قناتنا الرسمية على تلغرام لتصلك آخر التحديثات.</p>`:`<p><b>ZERO</b> is an Arabic-English platform focused on PlayStation 4 games and programs, along with guides and updates, organized in one fast, easy place.</p><h3>Our mission</h3><p>To make what you need easy to find: clear sections, quick search, and tidy details for every file such as size, version ID and release year.</p><h3>What we offer</h3><ul><li>PlayStation 4 games and programs, updated regularly.</li><li>Guides to help with installation and use.</li><li>News about updates and new releases.</li><li>Extra sections for other platforms, emulators, programs and themes.</li></ul><h3>Why ZERO?</h3><p>A simple interface in Arabic and English that runs smoothly on phones and desktops, with categorized content so you get where you want in fewer steps.</p><p>Follow our official Telegram channel for the latest updates.</p>`)},
privacy:function(){return wrap('privacy',lang=='ar'?`<p>آخر تحديث: 3 نوفمبر 2026</p><p>تشرح هذه السياسة كيف يتعامل موقع ZERO مع بياناتك عند استخدامه. باستخدامك للموقع فأنت توافق على ما ورد أدناه.</p><h3>1. البيانات التي نجمعها</h3><ul><li><b>البريد الإلكتروني:</b> فقط عند اشتراكك الاختياري بالنشرة، ونستخدمه لإرسال الجديد فقط.</li><li><b>إحصائيات التحميل:</b> أعداد إجمالية لكل ملف دون ربطها بهويتك.</li><li><b>تفضيلات المتصفح:</b> مثل اللغة والمفضلة، تُحفظ محلياً على جهازك ولا تُرسل إلينا.</li><li><b>بيانات تقنية عامة:</b> قد تجمعها الاستضافة أو خدمات الطرف الثالث (مثل عنوان IP ونوع المتصفح).</li></ul><p>لا نطلب من الزوار أسماءً أو كلمات مرور.</p><h3>2. ملفات تعريف الارتباط (الكوكيز)</h3><p>قد يستخدم الموقع وشركاؤه ملفات تعريف الارتباط وتقنيات مشابهة لحفظ تفضيلاتك وتحليل الزيارات وعرض الإعلانات. يمكنك حذفها أو حظرها من إعدادات متصفحك، لكن بعض ميزات الموقع قد لا تعمل بشكل كامل عندها.</p><h3>3. الإعلانات</h3><p>قد نعرض مستقبلاً إعلانات عبر خدمات طرف ثالث مثل Google AdSense. هذه الجهات قد تستخدم ملفات تعريف الارتباط لعرض إعلانات بناءً على زياراتك لهذا الموقع ومواقع أخرى. يمكنك إدارة الإعلانات المخصصة من <a href="https://adssettings.google.com" target="_blank" rel="noopener">adssettings.google.com</a>. نضع الإعلانات في أماكن مخصصة بعيدة عن أزرار التحميل حتى لا تتعرض للالتباس.</p><h3>4. خدمات الطرف الثالث</h3><p>قد يعتمد الموقع على Google Fonts للخطوط، وخدمات قواعد بيانات مثل Firebase للعدادات والاشتراكات، وروابط تحميل ومواقع خارجية لها سياساتها الخاصة التي ننصحك بمراجعتها.</p><h3>5. مشاركة البيانات</h3><p>لا نبيع بياناتك الشخصية. قد تصل بيانات تقنية إلى مزودي الخدمات المذكورة أعلاه لتشغيل الموقع أو عرض الإعلانات.</p><h3>6. الحذف والتواصل</h3><p>لطلب حذف بريدك من قائمة الاشتراك أو لأي استفسار عن الخصوصية، تواصل معنا عبر <a href="#contact">صفحة اتصل بنا</a>.</p><h3>7. الأطفال</h3><p>الموقع غير موجّه للأطفال دون 13 عاماً ولا نجمع بياناتهم عن قصد.</p><h3>8. تعديل السياسة</h3><p>قد نحدّث هذه الصفحة من حين لآخر، وسيظهر تاريخ آخر تحديث في أعلاها.</p>`:`<p>Last updated: November 3, 2026</p><p>This policy explains how ZERO handles your data. By using the site, you agree to what is described below.</p><h3>1. Data we collect</h3><ul><li><b>Email address:</b> only if you choose to subscribe, and used only to send you updates.</li><li><b>Download statistics:</b> aggregate counts per file, not tied to your identity.</li><li><b>Browser preferences:</b> such as language and favorites, stored locally on your device and not sent to us.</li><li><b>General technical data:</b> may be collected by hosting or third-party services (e.g. IP address, browser type).</li></ul><p>We do not ask visitors for names or passwords.</p><h3>2. Cookies</h3><p>The site and its partners may use cookies and similar technologies to remember preferences, analyze visits and serve ads. You can delete or block them in your browser settings, though some features may not work fully.</p><h3>3. Advertising</h3><p>We may show ads in the future through third-party services such as Google AdSense. These vendors may use cookies to serve ads based on your visits to this and other sites. You can manage personalized ads at <a href="https://adssettings.google.com" target="_blank" rel="noopener">adssettings.google.com</a>. We place ads in dedicated spots away from download buttons to avoid confusion.</p><h3>4. Third-party services</h3><p>The site may rely on Google Fonts, a database service such as Firebase for counters and subscriptions, and external download or website links that have their own policies, which we encourage you to review.</p><h3>5. Data sharing</h3><p>We do not sell your personal data. Technical data may reach the service providers above to run the site or serve ads.</p><h3>6. Deletion and contact</h3><p>To remove your email from the subscription list or ask about privacy, reach us via the <a href="#contact">Contact Us</a> page.</p><h3>7. Children</h3><p>The site is not directed to children under 13 and we do not knowingly collect their data.</p><h3>8. Changes</h3><p>We may update this page from time to time; the last-updated date appears at the top.</p>`)},
contact:function(){return wrap('contact',lang=='ar'?`<p>يسعدنا تواصلك لأي استفسار أو اقتراح أو مشكلة برابط أو ملف.</p><h3>قناتنا الرسمية على تلغرام</h3><p><a class="btn" target="_blank" rel="noopener" href="https://t.me/zerop3" style="display:inline-block;text-decoration:none">Telegram · @zerop3</a></p><h3>ماذا تراسلنا بشأنه؟</h3><ul><li>الإبلاغ عن رابط لا يعمل.</li><li>طلب إضافة لعبة أو برنامج.</li><li>طلبات حذف البريد من الاشتراك أو استفسارات الخصوصية.</li><li>إذا كنت صاحب حقوق وترى أن محتوىً معيناً يخالف حقوقك، راسلنا مع رابط المحتوى المقصود وسنراجعه بأقرب وقت.</li></ul>`:`<p>We are glad to hear from you about any question, suggestion, or problem with a link or file.</p><h3>Our official Telegram channel</h3><p><a class="btn" target="_blank" rel="noopener" href="https://t.me/zerop3" style="display:inline-block;text-decoration:none">Telegram · @zerop3</a></p><h3>What to contact us about</h3><ul><li>Reporting a broken link.</li><li>Requesting a game or program.</li><li>Email removal from the subscription list or privacy questions.</li><li>If you are a rights holder and believe specific content infringes your rights, send us the link to the content and we will review it promptly.</li></ul>`)}

function sbLoad(){if(!SB_URL)return;fetch(SB_URL+'/rest/v1/items?select=id,data&order=id.desc',{headers:sbH()}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){ITEMS=rows.map(function(x){var o=x.data||{};o._id=x.id;return o});LOADING=false;render();if(isAdm())drawList()}).catch(function(){LOADING=false;try{var z=JSON.parse(localStorage.getItem('zi')||'null');ITEMS=(z&&z.length)?z:JSON.parse(ORIG)}catch(e){ITEMS=JSON.parse(ORIG)}render();toast('تعذر الاتصال بقاعدة البيانات')})}
function sbLogin(){var e=$('lem').value.trim(),p=$('pw').value;fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:sbH(),body:JSON.stringify({email:e,password:p})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){setSess(d);$('pw').value='';applyAdm();openAdm()}).catch(function(){toast('البريد أو كلمة السر غلط')})}
function sbSave(o,id){var nm='';return sbTok().then(function(tok){var p=Promise.resolve();if(imgBlob){nm=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';var h=sbH(tok);h['Content-Type']='image/jpeg';p=fetch(SB_URL+'/storage/v1/object/covers/'+nm,{method:'POST',headers:h,body:imgBlob}).then(function(r){if(!r.ok)throw 'img';o.img=SB_URL+'/storage/v1/object/public/covers/'+nm})}return p.then(function(){return fetch(SB_URL+'/rest/v1/items'+(id?'?id=eq.'+id:''),{method:id?'PATCH':'POST',headers:sbH(tok),body:JSON.stringify({data:o})})}).then(function(r){if(!r.ok)throw 'db';resetForm();sbLoad();toast('تم الحفظ في قاعدة البيانات ✅')})}).catch(function(e){toast(e=='img'?'فشل رفع الصورة':e=='db'?'فشل الحفظ (تحقق من الصلاحيات)':'سجّل الدخول من جديد');if(e=='exp'||e=='no'){setSess(null);applyAdm()}})}
function sbDel(id){sbTok().then(function(tok){return fetch(SB_URL+'/rest/v1/items?id=eq.'+id,{method:'DELETE',headers:sbH(tok)})}).then(function(r){if(!r.ok)throw 0;resetForm();sbLoad();toast('تم الحذف')}).catch(function(){toast('فشل الحذف')})}
function sbMigrate(){var seed=JSON.parse(ORIG).filter(function(o){return o&&o.n});if(!seed.length)return toast('لا توجد ملفات للنقل');sbTok().then(function(tok){var rows=[],ch=Promise.resolve();seed.forEach(function(o,i){ch=ch.then(function(){if(o.img&&o.img.indexOf('data:')==0){var nm=Date.now()+'-'+i+'.jpg',h=sbH(tok);h['Content-Type']='image/jpeg';return fetch(SB_URL+'/storage/v1/object/covers/'+nm,{method:'POST',headers:h,body:d2b(o.img)}).then(function(r){if(r.ok)o.img=SB_URL+'/storage/v1/object/public/covers/'+nm;else delete o.img})}}).then(function(){delete o._id;rows.push({data:o})})});return ch.then(function(){return fetch(SB_URL+'/rest/v1/items',{method:'POST',headers:sbH(tok),body:JSON.stringify(rows.reverse())})})}).then(function(r){if(!r.ok)throw 0;sbLoad();toast('تم نقل '+seed.length+' ملف ✅')}).catch(function(){toast('فشل النقل')})}
LOADING=!!SB_URL;if(SB_URL){ITEMS=[];sbLoad()}
function subUI(){var b=$('subbox'),a=lang=='ar';b.classList.toggle('on',!!FB_URL);$('subt').textContent=a?'اشترك ليوصلك كل جديد من الملفات':'Subscribe to get new files';$('sbtn').textContent=a?'اشترك':'Subscribe';$('sem').placeholder=a?'بريدك الإلكتروني':'Your email'}
function subscribe(){var e=$('sem').value.trim().toLowerCase(),a=lang=='ar';
 if(!FB_URL||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)||e.length>120)return toast(a?'اكتب بريد صحيح':'Enter a valid email');
 var k=e.replace(/[.$#\[\]\/]/g,',');
 fetch(FB_URL+'/subs/'+encodeURIComponent(k)+'.json',{method:'PUT',body:JSON.stringify({e:e,t:Date.now()})}).then(function(r){
  if(r.ok){fetch(FB_URL+'/subCount.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}})}).catch(function(){});$('sem').value='';toast(a?'تم الاشتراك ✅':'Subscribed ✅')}
  else if(r.status==401||r.status==403)toast(a?'هذا البريد مشترك مسبقاً':'Already subscribed');
  else toast(a?'صار خطأ، حاول مرة ثانية':'Error, try again')}).catch(function(){toast(a?'صار خطأ، حاول مرة ثانية':'Error, try again')})}
function loadSubs(){var el=$('subn');if(!FB_URL){el.textContent='اربط Firebase أولاً';return}fetch(FB_URL+'/subCount.json').then(function(r){return r.json()}).then(function(n){el.textContent='👥 المشتركون: '+(n||0)}).catch(function(){el.textContent='تعذر الجلب'})}
loadCounts();
function copyPw(k){try{navigator.clipboard.writeText(ITEMS[k].pw).then(function(){toast('✅')},function(){toast(ITEMS[k].pw)})}catch(e){toast(ITEMS[k].pw)}}
applyAdm();if(location.hash=='#admin')openAdm();
render();
</script>
</body>
</html>
