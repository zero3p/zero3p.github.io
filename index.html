function lnk(k,f,u,t,g){if(!u||u=='#')return '';var c='btn'+(g?' g':''),s='style="text-align:center;text-decoration:none"';return f=='rv'?'<a class="'+c+'" target="_blank" rel="noopener" href="'+esc(u)+'" '+s+'>'+t+'</a>':'<a class="'+c+'" href="#" onclick="return cd('+k+',\''+f+'\')" '+s+'>'+t+'</a>'}
function showDet(k){
 history.pushState({modal:true},'');
 var o=ITEMS[k],D=DT[lang],c=COL[o.c]||COL.app,nm=esc(lang=='ar'?o.a:o.n);
 $('dbox').innerHTML='<h3><span>'+nm+'</span><button class="btn g" onclick="closeDet()">✕</button></h3><div class="cover" style="border-radius:12px;background:'+(o.img?'#000 url('+o.img+') center/contain no-repeat':'linear-gradient(135deg,'+c[0]+','+c[1]+')')+'">'+(o.img?'':'<strong>'+nm+'</strong>')+'</div>'+(o.d?'<p style="margin:0;color:var(--mu);font-size:14px;white-space:pre-wrap">'+esc(o.d)+'</p>':'')+[[D.sz,o.s],[lang=='ar'?'رقم النسخة':'Version ID',o.cn],[lang=='ar'?'سنة الإصدار':'Release year',o.yr],[lang=='ar'?'إصدار اللعبة':'Game version',o.gv],[lang=='ar'?'المنطقة':'Region',o.rg],[lang=='ar'?'صيغة اللعبة':'Format',o.fm],[lang=='ar'?'متطلبات التشغيل':'Requirements',o.rq],[lang=='ar'?'التحميلات':'Downloads',String(counts[ckey(o.n)]||0)]].map(function(r){return r[1]?'<div style="font-size:13px;color:var(--mu)">'+r[0]+': <span dir="auto">'+esc(r[1])+'</span></div>':''}).join('')+lnk(k,'u',o.u,D.g)+lnk(k,'up',o.up,D.u,1)+lnk(k,'ad',o.ad,D.a,1)+lnk(k,'ad2',o.ad2,D.a2,1)+lnk(k,'sv',o.sv,D.sv,1)+lnk(k,'lc',o.lc,D.lc,1)+lnk(k,'rv',o.rv,D.r,1)+(o.nt?'<div style="font-size:13px;color:var(--mu);white-space:pre-wrap">'+D.nt+': '+esc(o.nt)+'</div>':'')+(o.pw?'<div style="font-size:13px;color:var(--mu)">'+D.p+'</div><div class="r2"><input readonly dir="ltr" value="'+esc(o.pw)+'"><button class="btn g" onclick="copyPw('+k+')">'+D.cp+'</button></div>':'');
 $('det').classList.add('on')
}
function closeDet(){
 if(history.state && history.state.modal){
  history.back();
 } else {
  $('det').classList.remove('on');
 }
}
window.addEventListener('popstate', function(event) {
 if(!$('det').classList.contains('on')) return;
 $('det').classList.remove('on');
});
var cdTimer=0;
function cd(k,f){var o=ITEMS[k],u=o&&o[f],L=lang=='ar';
 if(!u||u=='#'){toast(L?'لا يوجد رابط بعد':'No link yet');return false}
 if(!/^https?:\/\//i.test(u)){toast('رابط غير صالح');return false}
 var n=3 ,b=$('cdb');cdKey=o.n;cdHit=false;clearInterval(cdTimer);
 $('cdt').textContent=(L?'جاري تجهيز التحميل: ':'Preparing download: ')+(L?o.a:o.n);
 b.className='btn g';b.href='#';b.style.pointerEvents='none';b.textContent=L?'انتظر...':'Please wait...';
 $('cdn').textContent=n;$('cdw').classList.add('on');
 cdTimer=setInterval(function(){n--;$('cdn').textContent=n;if(n<=0){clearInterval(cdTimer);$('cdn').textContent='✓';b.className='btn';b.href=u;b.style.pointerEvents='auto';b.textContent=L?'تحميل الآن':'Download now'}},1000);
 return false}
function closeCd(){clearInterval(cdTimer);$('cdw').classList.remove('on')}
var counts={},cdKey='',cdHit=false;
try{var fz=localStorage.getItem('zfb');if(fz&&!PUBLIC)FB_URL=fz}catch(e){}
function ckey(n){return String(n).replace(/[.$#\[\]\/]/g,'_')}
function cnt(i){return '<span class="cn">⬇ '+(counts[ckey(i.n)]||0)+'</span>'}
function loadCounts(){fetch(FB_URL?FB_URL+'/counts.json':'/api/downloads',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){counts=d||{};render()}).catch(function(){})}
function hit(n){var k=ckey(n);counts[k]=(counts[k]||0)+1;render();if(!FB_URL){fetch('/api/downloads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}).catch(function(){});return}fetch(FB_URL+'/counts/'+encodeURIComponent(k)+'.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}})}).catch(function(){})}
function subUI(){var b=$('subbox'),a=lang=='ar';b.classList.toggle('on',!!FB_URL);$('subt').textContent=a?'اشترك ليوصلك كل جديد من الملفات':'Subscribe to get new files';$('sbtn').textContent=a?'اشترك':'Subscribe';$('sem').placeholder=a?'بريدك الإلكتروني':'Your email'}
function subscribe(){var e=$('sem').value.trim().toLowerCase(),a=lang=='ar';
 if(!FB_URL||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)||e.length>120)return toast(a?'اكتب بريد صحيح':'Enter a valid email');
 var k=e.replace(/[.$#\[\]\/]/g,',');
 fetch(FB_URL+'/subs/'+encodeURIComponent(k)+'.json',{method:'PUT',body:JSON.stringify({e:e,t:Date.now()})}).then(function(r){
  if(r.ok){fetch(FB_URL+'/subCount.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}})}).catch(function(){});$('sem').value='';toast(a?'تم الاشتراك ✅':'Subscribed ✅')}
  else if(r.status==401||r.status==403)toast(a?'هذا البريد مشترك مسبقاً':'Already subscribed');
  else toast(a?'صار خطأ، حاول مرة ثانية':'Error, try again')}).catch(function(){toast(a?'صار خطأ، حاول مرة ثانية':'Error, try again')})}
function loadSubs(){var el=$('subn');if(!FB_URL){el.textContent='اربط Firebase أولاً';return}fetch(FB_URL+'/subCount.json').then(function(r){return r.json()}).then(function(n){el.textContent='👥 المشتركون: '+(n||0)}).catch(function(){el.textContent='تعذر الجلب'})}
loadCounts();
function copyPw(k){try{navigator.clipboard.writeText(ITEMS[k].pw).then(function(){toast('✅')},function(){toast(ITEMS[k].pw)})}catch(e){toast(ITEMS[k].pw)}}
applyAdm();if(location.hash=='#admin')openAdm();
render();
</script>
